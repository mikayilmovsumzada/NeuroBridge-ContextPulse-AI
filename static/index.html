<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextPulse AI</title>
    <meta name="description" content="ContextPulse AI: fasilədən sonra kontekst bərpası və komanda səviyyəsində tıxanmaların görünməsi. Context recovery after breaks and team-level blocker visibility.">
    <meta name="theme-color" content="#2b59d9">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Tema: yalnız istifadəçi əvvəl seçibsə saxlanmış seçim, əks halda sistem tərcihi (yazı etmir) -->
    <script>
        (function () {
            var dark = true;
            try {
                var s = localStorage.getItem('cp_theme');
                dark = s ? s === 'dark' : !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
            } catch (e) { /* saxlama əlçatmazdırsa standart */ }
            document.documentElement.classList.toggle('dark', dark);
        })();
    </script>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter Variable', 'Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['JetBrains Mono Variable', 'JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
                    },
                    // Brend rəngi (əvvəlki sky) bir qədər dərinləşdirildi: ağ mətnlə kontrast >= 4.5:1
                    colors: {
                        sky: { 50: '#eff5ff', 100: '#dbe7ff', 200: '#bfd3fe', 300: '#93b4fc', 400: '#6b95f9', 500: '#3b6ff0', 600: '#2b59d9', 700: '#2447b3', 800: '#223d8f', 900: '#1f376f', 950: '#162347' }
                    }
                }
            }
        }
    </script>
    <!-- React, ReactDOM və Babel (unpkg CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white">
    <noscript>ContextPulse AI JavaScript tələb edir. / ContextPulse AI requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
